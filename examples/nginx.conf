# HTTPS 反向代理範例（Let's Encrypt 憑證）。本機伺服器只監聽 127.0.0.1:8020。
server {
    listen 80;
    server_name academy.example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name academy.example.org;
    ssl_certificate     /etc/letsencrypt/live/academy.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.example.org/privkey.pem;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;   # AI mentor answers from a CPU model can take minutes
    }
    # Gateway callbacks must reach the server unchanged (no caching, no auth).
    location /api/billing/ { proxy_pass http://127.0.0.1:8020; proxy_set_header Host $host; proxy_read_timeout 60s; }
}
